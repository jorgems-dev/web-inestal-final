<section
  id="servicios"
  appFadeUp
  class="text-center bg-white dark:bg-gray-900 scroll-mt-35 rounded-lg shadow-xs border border-default m-2 md:m-10 p-10"
>
  <div class="text-center mb-10 md:mb-20">
    <span
      class="bg-[#7c70d9]/20 text-[#7c70d9] px-4 py-2 rounded-full font-semibold hover:bg-[#7c70d9]/30 transition m-20"
    >
      Servicios
    </span>
    <h1 class="mt-5 text-2xl font-semibold text-gray-800 md:text-3xl dark:text-white">
      Servicios de nuestro club
    </h1>
  </div>
  <div class="mx-auto max-w-6xl w-full grid gap-10 md:grid-cols-3 justify-items-center">
    @for (servicio of servicios; track servicio.titulo) {
      <article
        class="bg-neutral-primary-soft block w-full max-w-sm mx-auto p-5 border border-default rounded-base shadow-lg hover:shadow-2xl transition-shadow duration-300 ease-in-out"
      >
        <div class="text-center flex flex-col items-center">
          <div class="flex justify-center items-center bg-[#7c70d9]/20 w-16 h-16 rounded-2xl">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="1"
              stroke="#7c70d9"
              class="w-12 h-12"
            >
              <path stroke-linecap="round" stroke-linejoin="round" [attr.d]="servicio.svg"></path>
            </svg>
          </div>
          <h1 class="mt-5 text-2xl font-semibold text-gray-800 md:text-3xl dark:text-white mb-5">
            {{ servicio.titulo }}
          </h1>
          <p class="text-1xl md:text-1xl text-black mb-5 text-justify">
            {{ servicio.desc }}
          </p>
        </div>
      </article>
    }
  </div>
</section>
